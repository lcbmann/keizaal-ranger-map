<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ranger's Corps Field Atlas - Skyrim</title>
    <link rel="icon" type="image/svg+xml" href="ranger-corps-logo.svg" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" src="ranger-corps-logo.svg" alt="" />
          <div>
            <h1>Ranger's Corps Field Atlas - Skyrim</h1>
            <p>Keizaal field copy</p>
          </div>
        </div>
        <div class="draw-toolbar" aria-label="Map tools">
          <div class="segmented" role="group">
            <button class="tool-button is-active" type="button" data-mode="select" title="Select and pan">
              <span class="tool-glyph tool-glyph-select" aria-hidden="true"></span>
              <span>Select</span>
            </button>
            <button class="tool-button" type="button" data-mode="marker" title="Place a field mark">
              <span class="tool-glyph tool-glyph-mark" aria-hidden="true"></span>
              <span>Mark</span>
            </button>
            <button class="tool-button" type="button" data-mode="route" title="Draw a trail">
              <span class="tool-glyph tool-glyph-trail" aria-hidden="true"></span>
              <span>Trail</span>
            </button>
            <button class="tool-button" type="button" data-mode="range" title="Draw a range boundary">
              <span class="tool-glyph tool-glyph-range" aria-hidden="true"></span>
              <span>Range</span>
            </button>
          </div>
          <div class="draw-actions">
            <button id="finishDrawBtn" class="button primary" type="button" disabled>Finish</button>
            <button id="cancelDrawBtn" class="button secondary" type="button" disabled>Cancel</button>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="exportBtn" class="button secondary" type="button">Copy</button>
          <label class="button secondary file-button">
            Receive
            <input id="importInput" type="file" accept="application/json" />
          </label>
          <button id="clearBtn" class="button danger" type="button">Scrape Clean</button>
        </div>
      </header>

      <main class="workspace">
        <section class="map-stage" aria-label="Interactive Skyrim map">
          <div id="map"></div>
          <div id="statusBar" class="status-bar">Ready</div>
        </section>

        <aside class="panel ledger-panel">
          <section class="tool-section inspector">
            <h2>Selected</h2>
            <p id="emptySelection" class="empty-state selection-empty">Choose a mark, trail, or range from the map or ledger.</p>
            <form id="editorForm" class="editor-form">
              <input id="featureId" type="hidden" />
              <label class="field-label" for="titleInput">Title</label>
              <input id="titleInput" class="text-input" type="text" disabled />

              <label class="field-label" for="categoryInput">Category</label>
              <select id="categoryInput" class="text-input" disabled></select>

              <div class="field-grid">
                <div class="field-span">
                  <label class="field-label" for="confidenceInput">Confidence</label>
                  <select id="confidenceInput" class="text-input" disabled>
                    <option value="rumor">Rumor</option>
                    <option value="scouted">Scouted</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="stale">Stale</option>
                  </select>
                </div>
              </div>

              <label class="field-label" for="notesInput">Notes</label>
              <textarea id="notesInput" class="text-input textarea" rows="5" disabled></textarea>

              <div class="editor-actions">
                <button id="saveFeatureBtn" class="button primary" type="submit" disabled>Save</button>
                <button id="deleteFeatureBtn" class="button danger" type="button" disabled>Delete</button>
              </div>
            </form>
          </section>

          <section class="tool-section atlas-section">
            <h2>Atlas</h2>
            <label class="field-label" for="searchInput">Search</label>
            <input id="searchInput" class="text-input" type="search" placeholder="Name or note" />
            <div id="categoryFilters" class="filter-list" aria-label="Category filters"></div>
            <div id="featureList" class="feature-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
