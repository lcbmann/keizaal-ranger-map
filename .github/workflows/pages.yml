name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Supabase
        env:
          SUPABASE_URL: https://qmuuqnfpbfncwacrrmri.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || secrets.RANGER_ATLAS_SUPABASE_ANON_KEY || vars.RANGER_ATLAS_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set a GitHub secret or variable named SUPABASE_ANON_KEY with your Supabase public anon key."
            exit 1
          fi

          cat > supabase-config.js <<EOF
          window.RANGER_ATLAS_SUPABASE = {
            url: "$SUPABASE_URL",
            anonKey: "$SUPABASE_ANON_KEY",
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
